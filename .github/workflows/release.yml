name: Build release

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: xcode-27

    steps:
      - name: Compute release tag
        id: timestamp
        run: echo "tag=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install librsvg libavif

      - name: Extract browser icons
        run: scripts/extract-browser-icons.sh

      - name: Generate search engine data
        run: scripts/search-engines-data.sh

      - name: Generate onboarding assets
        run: scripts/onboarding-assets.sh

      - name: Package generated files
        run: scripts/package-generated.sh "${{ steps.timestamp.outputs.tag }}"

      - name: Make release body
        run: |
          cd generated
          echo '```' > /tmp/release.md
          shasum -a 256 nonfree-*.tar.gz >> /tmp/release.md
          echo '```' >> /tmp/release.md

      - name: Publish release
        uses: imputnet/immutable-release@v1
        with:
          tag: ${{ steps.timestamp.outputs.tag }}
          prerelease: true
          notes-file: /tmp/release.md
          files: |
            generated/nonfree-search-engines-data-${{ steps.timestamp.outputs.tag }}.tar.gz
            generated/nonfree-onboarding-assets-${{ steps.timestamp.outputs.tag }}.tar.gz
